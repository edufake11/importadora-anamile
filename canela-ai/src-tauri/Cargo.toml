[package]
name = "canela-ai"
version = "0.4.0"
description = "CANELA AI — mascota virtual e asistente inteligente de escritorio"
edition = "2021"
rust-version = "1.82"

[lib]
name = "canela_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
similar = "2.7.0"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
cpal = "0.17.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
base64 = "0.23.1"
pdf-extract = { version = "0.12.1", default-features = false }
url = "2"
# Reconocimiento de voz local (whisper.cpp, licencia MIT; enlaces Unlicense).
whisper-rs = { version = "0.16", optional = true }
sha2 = "0.10"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Llavero del sistema: Administrador de credenciales en Windows.
[features]
default = ["local-stt"]
# Compila whisper.cpp dentro de Canela (CPU). Sin esta función la voz local
# no está disponible (útil para comprobaciones rápidas de tipos).
local-stt = ["dep:whisper-rs"]

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_ProcessStatus"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "macros"] }

# Compilaciones de desarrollo más ligeras en disco (no afecta al instalador).
# whisper.cpp se compila en modo «Release» aunque Canela esté en desarrollo
# (si no, el reconocimiento de voz sería ~10 veces más lento).
[profile.dev.build-override]
debug-assertions = false
opt-level = 2

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
