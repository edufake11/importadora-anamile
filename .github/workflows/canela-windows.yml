name: Canela AI (Windows)

on:
  push:
    paths:
      - 'canela-ai/**'
      - '.github/workflows/canela-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: canela-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canela-ai/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: canela-ai/src-tauri

      # whisper.cpp se configura con CMake, que guarda la ruta absoluta del
      # compilador. Si GitHub actualiza Visual Studio en la imagen de Windows,
      # la caché restaurada apunta a un compilador que ya no existe: se borra
      # esa configuración para que CMake la regenere (el resto de la caché se
      # conserva).
      - name: Limpiar configuración de CMake en caché (whisper.cpp)
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target -Directory -Recurse -Filter "whisper-rs-sys-*" -ErrorAction SilentlyContinue |
            Where-Object { $_.Parent.Name -eq "build" } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Configuración de whisper.cpp en caché eliminada (si existía)."

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de interfaz y tipos
        run: |
          npm run typecheck
          npm test

      - name: Pruebas de Rust
        working-directory: canela-ai/src-tauri
        run: cargo test

      - name: Generar instaladores (NSIS + MSI)
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: canela-ai-windows-instaladores
          path: |
            canela-ai/src-tauri/target/release/bundle/nsis/*.exe
            canela-ai/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
