name: Canela AI (Windows)

on:
  push:
    paths:
      - 'canela-ai/**'
      - '.github/workflows/canela-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: canela-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canela-ai/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: canela-ai/src-tauri

      # whisper.cpp se configura con CMake, que guarda la ruta absoluta del
      # compilador. Si GitHub actualiza Visual Studio en la imagen de Windows,
      # la caché restaurada apunta a un compilador que ya no existe. Se borra
      # sólo whisper-rs-sys con `cargo clean -p` (sirve para cualquier
      # organización de carpetas de Cargo); el resto de la caché se conserva.
      - name: Limpiar whisper.cpp de la caché de compilación
        working-directory: canela-ai/src-tauri
        shell: pwsh
        run: |
          cargo clean -p whisper-rs-sys
          cargo clean -p whisper-rs-sys --release
          Write-Host "whisper.cpp se volverá a configurar con el compilador actual."

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de interfaz y tipos
        run: |
          npm run typecheck
          npm test

      # Muestra cómo ve el entorno npm al lanzar pruebas (sólo informa; las
      # pruebas de verdad son el paso siguiente y deben pasar todas).
      - name: Diagnóstico de comprobaciones de código (informativo)
        working-directory: canela-ai/src-tauri
        continue-on-error: true
        run: cargo test --lib diagnostico_entorno_de_npm -- --nocapture

      - name: Pruebas de Rust
        working-directory: canela-ai/src-tauri
        run: cargo test

      - name: Generar instaladores (NSIS + MSI)
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: canela-ai-windows-instaladores
          path: |
            canela-ai/src-tauri/target/release/bundle/nsis/*.exe
            canela-ai/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
